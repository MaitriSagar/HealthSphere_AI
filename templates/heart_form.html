{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Cardiovascular Risk Assessment</h2>
        <p class="text-gray-500 mt-2">Enter the optimized top 6 biological markers</p>
    </div>

    <form action="/predict_heart" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Age -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                <input type="number" step="any" name="age" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Chest Pain Type (cp) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Chest Pain Type (0-3)</label>
                <input type="number" step="any" name="cp" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition" placeholder="e.g., 0, 1, 2, or 3">
            </div>

            <!-- Serum Cholesterol (chol) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Serum Cholesterol (mg/dl)</label>
                <input type="number" step="any" name="chol" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Max Heart Rate (thalch) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Max Heart Rate Achieved</label>
                <input type="number" step="any" name="thalch" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- ST Depression (oldpeak) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ST Depression (oldpeak)</label>
                <input type="number" step="any" name="oldpeak" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition" placeholder="e.g., 1.5">
            </div>

            <!-- Exercise Induced Angina (exang) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Exercise Angina (0 = No, 1 = Yes)</label>
                <input type="number" step="any" name="exang" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

        </div>

        <button type="submit" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1">
            Run AI Analysis
        </button>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Diabetes Risk Assessment</h2>
        <p class="text-gray-500 mt-2">Enter patient metrics for early-onset prediction</p>
    </div>

    <form action="/predict_diabetes" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pregnancies</label>
                <input type="number" step="any" name="pregnancies" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="0 if none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Glucose Level</label>
                <input type="number" step="any" name="glucose" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Blood Pressure (Diastolic)</label>
                <input type="number" step="any" name="bloodpressure" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Skin Thickness</label>
                <input type="number" step="any" name="skinthickness" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Insulin Level</label>
                <input type="number" step="any" name="insulin" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">BMI</label>
                <input type="number" step="any" name="bmi" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Diabetes Pedigree Function</label>
                <input type="number" step="any" name="dpf" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="e.g. 0.5">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                <input type="number" step="any" name="age" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

        </div>

        <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1">
            Run AI Analysis
        </button>
    </form>
</div>
{% endblock %}
